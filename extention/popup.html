<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Wazir — Game Review</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="wazir-root">
      <!-- HEADER -->
      <header id="header">
        <div class="hdr-left">
          <img src="icons/pawn-32.png" alt="W" class="logo" />
          <div class="title">
            <div class="app">WAZIR</div>
            <div class="sub">Game Review</div>
          </div>
        </div>
        <div class="hdr-right">
          <div id="opening-name" class="muted">Opening: —</div>
        </div>
      </header>

      <!-- TABS -->
      <nav id="tabs" role="tablist">
        <button
          class="tab active"
          data-tab="summary"
          role="tab"
          aria-selected="true"
        >
          Summary
        </button>
        <button class="tab" data-tab="moves" role="tab">Move List</button>
        <button class="tab" data-tab="board" role="tab">Board</button>
      </nav>

      <!-- CONTENT -->
      <main id="content">
        <!-- ========== SUMMARY PANEL ========== -->
        <section id="panel-summary" class="panel active" role="tabpanel">
          <!-- Player Cards -->
          <div class="players-row">
            <!-- White Player -->
            <div class="player-card white">
              <div class="player-header">
                <div class="player-avatar" id="w-avatar"></div>
                <div class="player-info">
                  <div class="player-name" id="w-name">White</div>
                  <div class="player-rating" id="w-rating">—</div>
                </div>
              </div>
              <div class="accuracy-display">
                <div class="accuracy-label">Accuracy</div>
                <div class="accuracy-value" id="w-accuracy">—</div>
              </div>
              <div class="acpl-display">
                <span>ACPL:</span>
                <span id="w-acpl">—</span>
              </div>
              <div class="move-badges" id="w-badges"></div>
            </div>

            <!-- Black Player -->
            <div class="player-card black">
              <div class="player-header">
                <div class="player-avatar" id="b-avatar"></div>
                <div class="player-info">
                  <div class="player-name" id="b-name">Black</div>
                  <div class="player-rating" id="b-rating">—</div>
                </div>
              </div>
              <div class="accuracy-display">
                <div class="accuracy-label">Accuracy</div>
                <div class="accuracy-value" id="b-accuracy">—</div>
              </div>
              <div class="acpl-display">
                <span>ACPL:</span>
                <span id="b-acpl">—</span>
              </div>
              <div class="move-badges" id="b-badges"></div>
            </div>
          </div>

          <!-- Charts -->
          <div class="charts-section">
            <div class="chart-container">
              <div class="chart-label">Advantage</div>
              <canvas
                id="adv-graph"
                class="chart-canvas"
                width="900"
                height="80"
              ></canvas>
            </div>
            <div class="chart-container">
              <div class="chart-label">Accuracy per Move</div>
              <canvas
                id="acc-graph"
                class="chart-canvas"
                width="900"
                height="60"
              ></canvas>
            </div>
          </div>

          <!-- Controls -->
          <div class="controls-section">
            <div class="controls-row">
              <button id="btn-auto" class="btn primary">
                <svg
                  width="14"
                  height="14"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path
                    d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"
                  />
                </svg>
                Get PGN
              </button>

              <div class="control-group">
                <span class="control-label">Depth</span>
                <select id="depth" class="styled-select">
                  <option value="12">12</option>
                  <option value="16">16</option>
                  <option value="18">18</option>
                  <option value="20" selected>20</option>
                  <option value="22">22</option>
                </select>
              </div>

              <div class="control-group">
                <span class="control-label">Time (ms)</span>
                <input
                  id="ms"
                  type="number"
                  class="styled-input"
                  min="50"
                  max="5000"
                  value="100"
                />
              </div>

              <div class="control-group">
                <span class="control-label">MultiPV</span>
                <select id="mpv" class="styled-select">
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3" selected>3</option>
                </select>
              </div>

              <button id="btn-analyze" class="btn accent">
                <svg
                  width="14"
                  height="14"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <polygon points="5 3 19 12 5 21 5 3" />
                </svg>
                Analyze
              </button>

              <button id="btn-board" class="btn secondary" disabled>
                Board View
              </button>
            </div>

            <div class="progress-section">
              <div class="progress-bar">
                <div class="progress-fill" id="progress-bar"></div>
              </div>
              <div class="progress-text" id="progress-text">Ready</div>
            </div>
          </div>

          <!-- PGN Input -->
          <div class="pgn-section">
            <textarea
              id="pgn-input"
              class="pgn-textarea"
              placeholder="Paste PGN here or click 'Get PGN' to fetch from Chess.com..."
            ></textarea>
          </div>
        </section>

        <!-- ========== MOVES PANEL ========== -->
        <section
          id="panel-moves"
          class="panel"
          role="tabpanel"
          aria-hidden="true"
        >
          <div class="moves-header">
            <div class="moves-title" id="moves-title">Game Moves</div>
            <div class="moves-subtitle" id="moves-subtitle">—</div>
          </div>
          <div class="moves-list" id="moves-list"></div>
        </section>

        <!-- ========== BOARD PANEL ========== -->
        <section
          id="panel-board"
          class="panel"
          role="tabpanel"
          aria-hidden="true"
        >
          <div class="board-layout">
            <!-- Eval Bar -->
            <div class="eval-bar-container" id="eval-bar">
              <div class="eval-bar-white" id="eval-bar-white"></div>
              <div class="eval-bar-value top" id="eval-top">—</div>
              <div class="eval-bar-value bottom" id="eval-bottom">—</div>
            </div>

            <!-- Board -->
            <div class="board-section">
              <div class="board-wrapper" id="board-wrapper">
                <canvas id="board-canvas" width="480" height="480"></canvas>
                <div class="board-coords" id="board-coords"></div>
                <div class="board-overlay" id="board-overlay"></div>
                <div
                  class="move-badge-overlay"
                  id="move-badge-overlay"
                  style="display: none"
                ></div>
              </div>

              <div class="board-controls">
                <button class="nav-btn" id="btn-first" title="First">⏮</button>
                <button class="nav-btn" id="btn-prev" title="Previous">
                  ◀
                </button>
                <div class="ply-display" id="ply-display">0/0</div>
                <button class="nav-btn" id="btn-next" title="Next">▶</button>
                <button class="nav-btn" id="btn-last" title="Last">⏭</button>

                <div class="spacer"></div>

                <label class="flip-toggle">
                  <input type="checkbox" id="flip-board" />
                  Flip
                </label>

                <button class="btn secondary" id="btn-back">Back</button>
              </div>

              <div class="quick-filters">
                <button class="filter-btn" data-filter="blunder">
                  Blunders
                </button>
                <button class="filter-btn" data-filter="mistake">
                  Mistakes
                </button>
                <button class="filter-btn" data-filter="brilliant">
                  Brilliant
                </button>
                <button class="filter-btn" data-filter="best">Best</button>
              </div>
            </div>

            <!-- Info Panel -->
            <div class="info-panel">
              <div class="pos-info-card">
                <div class="pos-info-label">Position</div>
                <div class="pos-info-value" id="pos-fen">—</div>
              </div>

              <div class="best-move-display">
                <div class="best-move-label">Best Move</div>
                <div class="best-move-san" id="best-move-san">—</div>
                <div class="pv-line" id="pv-line">PV: —</div>
                <div class="eval-display" id="eval-display">—</div>
              </div>

              <div class="pv-buttons">
                <button class="pv-btn active" data-pv="1">PV1</button>
                <button class="pv-btn" data-pv="2">PV2</button>
                <button class="pv-btn" data-pv="3">PV3</button>
              </div>

              <div class="mini-moves" id="mini-moves"></div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
