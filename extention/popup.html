<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Wazir — Game Review</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="wazir-root">
      <header id="header">
        <div class="hdr-left">
          <img src="icons/pawn-32.png" alt="W" class="logo" />
          <div class="title">
            <div class="app">WAZIR</div>
            <div class="sub">Game Review</div>
          </div>
        </div>

        <div class="hdr-right">
          <div id="opening-name" class="muted">— Opening: Unknown</div>
        </div>
      </header>

      <nav id="tabs" role="tablist">
        <button
          class="tab active"
          data-tab="summary"
          role="tab"
          aria-selected="true"
        >
          Summary
        </button>
        <button class="tab" data-tab="moves" role="tab">Move List</button>
        <button class="tab" data-tab="board" role="tab">Board</button>
      </nav>

      <main id="content">
        <!-- SUMMARY PANEL -->
        <section id="panel-summary" class="panel active" role="tabpanel">
          <div class="summary-grid">
            <div class="metrics card">
              <div class="metrics-row">
                <div class="metric">
                  <div class="label">White Accuracy</div>
                  <div id="w-acc" class="big">-</div>
                </div>
                <div class="metric">
                  <div class="label">Black Accuracy</div>
                  <div id="b-acc" class="big">-</div>
                </div>
              </div>

              <div class="metrics-row mt8">
                <div class="metric small">
                  <div class="label">White ACPL</div>
                  <div id="w-acpl">-</div>
                </div>
                <div class="metric small">
                  <div class="label">Black ACPL</div>
                  <div id="b-acpl">-</div>
                </div>
              </div>

              <div class="badges-row mt10">
                <div id="w-badges" class="badges"></div>
                <div id="b-badges" class="badges" style="margin-top: 6px"></div>
              </div>

              <div class="controls mt12">
                <button id="btn-auto" class="btn primary">
                  Get PGN from page
                </button>
                <div class="select-row">
                  <label class="label-inline">
                    Depth
                    <select id="depth" class="styled-select">
                      <option value="10">d10</option>
                      <option value="14">d14</option>
                      <option value="18">d18</option>
                      <option value="20" selected>d20</option>
                    </select>
                  </label>
                  <label class="label-inline">
                    ms
                    <input
                      id="ms"
                      type="number"
                      min="40"
                      max="10000"
                      value="50"
                    />
                  </label>
                  <label class="label-inline">
                    MultiPV
                    <select id="mpv" class="styled-select">
                      <option value="1">1</option>
                      <option value="2">2</option>
                      <option value="3" selected>3</option>
                    </select>
                  </label>
                  <button id="analyze" class="btn accent">Analyze</button>
                </div>
              </div>

              <div class="notes mt10 card small muted" id="notes">Notes: -</div>
            </div>

            <div class="charts card">
              <div class="chart-header">
                <div class="label">Accuracy Graph</div>
                <div class="muted small">per ply</div>
              </div>
              <canvas id="acc-graph" width="700" height="160"></canvas>

              <div class="chart-header mt8">
                <div class="label">Advantage Graph</div>
                <div class="muted small">engine eval (centipawns)</div>
              </div>
              <canvas id="adv-graph" width="700" height="120"></canvas>
            </div>
          </div>

          <div class="progress" style="margin-top: 10px">
            <div id="bar" class="bar"></div>
          </div>
          <div id="progress" class="small muted mt6">Ready</div>

          <div class="pgn-box mt10 card">
            <textarea
              id="pgn"
              placeholder="Paste PGN here or fetch from page..."
            ></textarea>
            <div class="pgn-actions">
              <button id="board-view" class="btn" disabled>Board view</button>
              <div id="auto-status" class="muted small">
                Paste PGN below if auto-fetch fails.
              </div>
            </div>
          </div>
        </section>

        <!-- MOVES PANEL -->
        <section
          id="panel-moves"
          class="panel"
          role="tabpanel"
          aria-hidden="true"
        >
          <div class="moves-container card">
            <div id="title" class="title muted">-</div>
            <div id="moves" class="move-list"></div>
          </div>
        </section>

        <!-- BOARD PANEL -->
        <section
          id="panel-board"
          class="panel"
          role="tabpanel"
          aria-hidden="true"
        >
          <div class="board-wrap card">
            <div class="board-left">
              <div class="board-canvas-wrap">
                <!-- width/height attributes present; JS will do HiDPI scaling -->
                <canvas id="board-canvas" width="520" height="520"></canvas>
                <div id="coords" class="coords"></div>

                <div id="move-badge" class="move-badge"></div>
                <!-- moved ABOVE overlay -->

                <div id="board-overlay" class="board-overlay"></div>
              </div>

              <!-- BOARD CONTROLS -->
              <div class="board-controls mt8">
                <button id="btn-first" class="small-btn">|&lt;</button>
                <button id="btn-prev" class="small-btn">&lt;</button>
                <div id="ply-indicator" class="muted">-/-</div>
                <button id="btn-next" class="small-btn">&gt;</button>
                <button id="btn-last" class="small-btn">&gt;|</button>
                <div style="flex: 1"></div>
                <label class="muted small">
                  Flip <input id="flip" type="checkbox" />
                </label>
                <button id="btn-exit" class="btn">Back</button>
              </div>

              <!-- QUICK FILTERS (OPTION A) -->
              <div id="quick-filters" class="quick-filters mt10">
                <button data-tag="blunder">Blunders</button>
                <button data-tag="great">Great</button>
                <button data-tag="best">Best</button>
              </div>
            </div>

            <div class="board-right">
              <div id="pos-header" class="muted small">-</div>

              <div class="pos-info">
                <div id="best-move" class="mono">Best: -</div>
                <div id="pv-line" class="small muted">PV: -</div>
                <div id="eval-line" class="small muted">Eval: -</div>
              </div>

              <div class="mini-moves mt10" id="mini-moves"></div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="popup.js"></script>
    <script type="module" src="popup-ui.js"></script>
  </body>
</html>
